<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Induction Week · Command Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#d9ecfd;--pn:#e6f3ff;--pn2:#f4faff;--tx:#0b2545;--mu:#4b6587;--ac:#1f5fd6;--ln:#b6d5f2;--hv:#cde5fb;--st:#08142a;--ok:#15803d;--bad:#c2261d;
 --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;overflow:hidden;font:15px/1.5 "Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--ln);background:var(--pn2);color:var(--tx);padding:7px 12px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
code{font-family:var(--mono)}

/* navbar + footer */
#nav{flex:none;position:relative;z-index:30;display:flex;align-items:center;gap:18px;padding:7px 16px;background:var(--pn);border-bottom:1px solid var(--ln)}
#nav .brand{display:flex;align-items:center;gap:12px;white-space:nowrap;font-family:"Oswald",Impact,sans-serif;font-weight:700;font-size:23px;letter-spacing:.06em;line-height:1;color:var(--tx)}
#nav .brand img{height:38px;width:auto;display:block}
#nav .prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu);white-space:nowrap}
#nav .adm{position:relative}
#admb{font-weight:700;font-size:13px;letter-spacing:.06em;background:var(--tx);color:#fff;border:0;padding:8px 14px}
#admm{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:#fff;border:1px solid var(--ln);border-radius:12px;box-shadow:0 14px 34px rgba(11,37,69,.2);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
#admm[hidden]{display:none}#admm small{color:var(--mu);font-size:12px}#admm a{color:var(--ac);text-decoration:none;font-weight:600}
#nav .pb{width:170px;height:8px;border-radius:4px;background:var(--hv);overflow:hidden}#nav .pb i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
#ft{flex:none;padding:7px 18px;background:var(--pn);border-top:1px solid var(--ln);font-size:12.5px;color:var(--mu);display:flex;gap:18px;flex-wrap:wrap}
#ft b{color:var(--tx);font-weight:600}

/* layout */
#wrap{flex:1;display:flex;min-height:0;}
#sb{width:330px;flex:none;background:var(--pn);border-right:1px solid var(--ln);overflow-y:auto;padding:14px 14px 22px}
#mn{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--st)}

/* stage */
#sth{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:40px;color:#bcd3f5;font-size:13.5px;border-bottom:1px solid #1b2f52}
#sth .led{width:10px;height:10px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;flex:none}
#sth .led.on{background:#22c55e;box-shadow:0 0 10px #22c55e}
#sth #stt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sth .xy{margin-left:auto;font-family:var(--mono);color:#7dd3fc;white-space:nowrap}
#sw{flex:1;position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#13294d 0,#08142a 72%)}
.card{position:absolute;inset:0;overflow:hidden}
.card *{visibility:hidden}
.card canvas.stage{visibility:visible;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:12px;background:#0f1d36;box-shadow:0 0 0 1px #24406b,0 24px 60px rgba(0,0,0,.55);transition:box-shadow .35s;cursor:crosshair}
.card canvas.stage.pulse{box-shadow:0 0 0 3px #38bdf8,0 0 44px rgba(56,189,248,.6)}
.card canvas.stage.err{box-shadow:0 0 0 3px #ef4444,0 0 44px rgba(239,68,68,.55)}
.card canvas.stage.d3{left:0;top:0;transform:none;width:100%!important;height:100%!important;border-radius:0;box-shadow:none;cursor:default}
.card canvas.stage.d3.pulse{box-shadow:none;outline:3px solid #38bdf8;outline-offset:-3px}.card canvas.stage.d3.err{box-shadow:none;outline:3px solid #ef4444;outline-offset:-3px}
.optl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.optl .chip{text-align:center;font-size:13px}
details.key{margin-top:8px;font-size:12.5px;color:var(--mu)}details.key summary{cursor:pointer;font-weight:600;color:var(--ac)}details.key div{display:flex;gap:6px;margin-top:3px}details.key code{background:var(--hv);padding:0 5px;border-radius:5px;color:var(--tx)}
#ro{flex:none;padding:9px 14px;background:#0d1c36;color:#e3eeff;border-top:1px solid #1b2f52;font-size:14px;min-height:44px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#ro b{color:#7dd3fc;font-weight:600}
.xl{position:absolute;pointer-events:none;background:rgba(125,211,252,.5);display:none;z-index:2}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%) scale(.9);background:#0b2a55;color:#e0f2fe;border:1px solid #38bdf8;border-radius:999px;padding:6px 16px;font-family:var(--mono);font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:4;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}#toast.bad{background:#4a0f12;border-color:#ef4444;color:#fecaca}
#lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center;background:rgba(6,14,30,.7);color:#e3eeff;z-index:5;padding:24px;cursor:pointer}
#lock[hidden]{display:none}
#lock .lk1{font-size:clamp(20px,2.6vw,30px);font-weight:700}#lock .lk2{color:#a9c1e6;max-width:46ch}
#hint{position:absolute;z-index:6;pointer-events:none;background:#fef3c7;color:#713f12;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;transform:translate(-50%,-130%);white-space:nowrap}
#hint.show{opacity:1}
#burst{position:absolute;inset:0;pointer-events:none;z-index:7;display:flex;align-items:center;justify-content:center;overflow:hidden}
#burst .msg{background:rgba(21,128,61,.95);color:#fff;font-weight:700;font-size:clamp(18px,2.4vw,28px);padding:12px 26px;border-radius:14px;animation:pop .45s ease-out}
#burst .cf{position:absolute;top:46%;left:50%;width:9px;height:14px;border-radius:2px;animation:fly 1.4s ease-out forwards}
.rip{position:absolute;z-index:3;width:46px;height:46px;border:3px solid #fde047;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(.2);animation:rip .9s ease-out forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* animated intro in the main panel */
.ia{display:flex;flex-direction:column;align-items:center;gap:16px}
.ia .t{font-family:"Oswald",Impact,sans-serif;font-weight:700;font-size:clamp(30px,5.5vw,64px);letter-spacing:.08em;line-height:1.05;animation:iaT 1s cubic-bezier(.2,.8,.2,1) both}
.ia .s{font-size:clamp(16px,2.3vw,28px);font-weight:600;color:#7dd3fc;animation:iaS .9s .9s both}
.ia img{max-width:60%;max-height:clamp(80px,20vh,180px);animation:iaL 1s 1.8s cubic-bezier(.2,.8,.2,1) both}
.ia .h{margin-top:6px;font-size:14px;color:#a9c1e6;animation:iaS .9s 3s both}
@keyframes iaT{from{opacity:0;letter-spacing:.4em;transform:translateY(-20px)}to{opacity:1;letter-spacing:.08em;transform:none}}
@keyframes iaS{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes iaL{from{opacity:0;transform:scale(.5) rotate(-8deg)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.ia *{animation:none!important}}

/* sidebar: list */
.intro{font-size:14px;color:var(--mu);margin:2px 4px 6px}
.cat{font-size:13px;font-weight:700;color:var(--ac);margin:16px 6px 4px}
.it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:9px;font-size:14px}
.it:hover{background:var(--hv)}
.it i{font-style:normal;width:26px;height:26px;flex:none;border-radius:50%;background:var(--pn2);border:1px solid var(--ln);display:grid;place-items:center;font-size:12px;color:var(--mu)}
.it.dn i{background:#16a34a;color:#fff;border-color:#16a34a}
.it em{white-space:nowrap;font-style:normal;font-size:10.5px;font-weight:700;color:#7c2d12;background:#fed7aa;border-radius:6px;padding:1px 6px;margin-left:auto}

/* sidebar: task */
.back{border:0;background:none;color:var(--ac);padding:4px 2px;font-weight:600}
.tn{font-size:12.5px;color:var(--mu);margin:8px 2px 2px}
#sb h2{font-size:21px;line-height:1.25;margin:2px 2px 10px}
.obj{background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.obj h3{font-size:14px;margin:0 0 4px}.obj p{margin:4px 0;font-size:14px}.obj .bn{color:var(--mu)}
.note{margin:12px 0;background:#fff6dc;border:1px solid #f1cf74;color:#5f4205;border-radius:12px;padding:10px 12px;font-size:14px}
.startb{width:100%;padding:13px;font-size:19px;font-weight:700;background:var(--ac);color:#fff;border:0;border-radius:12px;box-shadow:0 4px 0 #154aa8;letter-spacing:.02em}
.startb:active{transform:translateY(2px);box-shadow:0 2px 0 #154aa8}
.row2{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.live{color:var(--ok);font-weight:600}.rst{padding:5px 10px;font-size:13px}
.finbox{background:#dcfce7;border:1px solid #86efac;color:#14532d;border-radius:12px;padding:10px 12px;font-size:14px}.finbox .rst{display:block;margin-top:8px}
ol.stl{list-style:none;padding:0;margin:12px 0 0}
ol.stl>li{border:1px solid var(--ln);border-radius:12px;margin:8px 0;padding:9px 11px;background:var(--pn2);font-size:13.5px}
ol.stl>li.todo{opacity:.62}
ol.stl>li.fin{border-left:5px solid #16a34a}
ol.stl>li.cur{border:2px solid var(--ac);background:#fff;box-shadow:0 6px 18px rgba(31,95,214,.16)}
.sh{font-weight:700;font-size:13px;color:var(--ac)}li.fin .sh{color:var(--ok)}li.cur .sh{font-size:15px}
.ssum{color:var(--mu);margin-top:2px}.lsn{margin-top:4px;font-size:12.5px;color:#14532d}
.blk{margin-top:10px}.blk h4{margin:0 0 3px;font-size:13px;color:var(--tx)}.blk p{margin:0}
.tip{font-size:12.5px;color:var(--mu);margin-top:6px!important}
.tip.dec{color:#7c2d12;background:#fff1e6;border-radius:8px;padding:6px 8px}
.chips[hidden]{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips.sm code{background:var(--hv);padding:1px 6px;border-radius:5px;font-size:12px}
.chip{font-family:var(--mono);font-weight:700;font-size:13.5px;background:#0b1d3a;color:#a5f3fc;border-radius:8px;padding:5px 9px;word-break:break-word}
.chip.ok{background:#dcfce7;color:#166534;text-decoration:line-through}
.chip.nx{box-shadow:0 0 0 2px #f59e0b}
.then{font-size:12px;color:var(--mu)}
.rule{font-family:var(--mono);font-size:13px;background:#eef6ff;border:1px dashed var(--ac);border-radius:9px;padding:7px 9px;color:var(--tx);line-height:1.45}
.rule b{color:var(--ac)}.rule .q{display:inline-block;min-width:26px;text-align:center;background:#f59e0b;color:#fff;border-radius:6px;font-weight:700}
.opts{display:grid;gap:6px;margin-top:8px}.opts div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.opts .chip{flex:none;min-width:118px;text-align:center}
.means{font-size:12px;color:var(--mu);margin-top:4px}.means i{font-family:var(--mono);font-style:normal}
.term{margin-top:10px;background:#0b1d3a;border-radius:12px;padding:8px 8px 8px 12px}
.term:focus-within{box-shadow:0 0 0 3px #f59e0b}
.term.shake,.startb.nudge{animation:sh .35s}
.pr{display:flex;gap:6px;align-items:center}.pr span{color:#22c55e;font-family:var(--mono);font-weight:700}
.ci{flex:1;min-width:0;background:transparent;border:0;color:#e0f2fe;font-family:var(--mono);font-size:14px;padding:6px 2px;outline:none}
.ci::placeholder{color:#5f7aa6}
.runb{background:#22c55e;border:0;color:#052e16;font-weight:700;flex:none}
.res{margin-top:10px}.res h4{margin:0 0 4px;font-size:13px}
.log{max-height:190px;overflow:auto;border:1px solid var(--ln);border-radius:10px;padding:4px 8px;background:var(--pn2);font-size:13px;min-height:38px}
.log:empty::before{content:"Results of your commands appear here.";color:var(--mu)}
.log div{padding:5px 0;border-bottom:1px dashed var(--ln);word-break:break-word}.log div:last-child{border:0}
.log .bad{color:var(--bad)}.log .ok{color:var(--ok)}.log .ai{color:#2d4a78}
.log code,.blk code,.note code{background:var(--hv);padding:1px 5px;border-radius:5px;font-size:12.5px}
.lks{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--mu);align-items:center}
.lks a{color:var(--ac);font-weight:600;text-decoration:none;border:1px solid var(--ln);border-radius:8px;padding:4px 8px;background:var(--pn2)}
.pdfz{margin-top:14px;border-top:1px solid var(--ln);padding-top:12px}
.pdfz h4{margin:0 0 6px;font-size:14px}
.pdfz .two{display:grid;grid-template-columns:1fr 118px;gap:8px}
.pdfz label{font-size:13px;color:var(--mu)}
.pdfz input,.pdfz select{width:100%;margin:4px 0 8px;font:inherit;padding:7px 10px;border:1px solid var(--ln);border-radius:9px;background:#fff;color:var(--tx)}
.pdfz .bad{border-color:var(--bad);box-shadow:0 0 0 3px rgba(194,38,29,.18)}
.req{color:var(--bad);font-weight:700}
.pdfb{width:100%;padding:10px;font-weight:700;background:#fff;border:2px solid var(--ac);color:var(--ac)}
.pst{font-size:13px;color:var(--mu);margin-top:6px;min-height:1em}
.pst.bad{color:var(--bad);font-weight:600}

@media(max-width:760px){#nav{flex-wrap:wrap;gap:8px;padding:7px 10px}#nav .brand{font-size:17px}#nav .prog{order:3;width:100%;justify-content:center;margin:0}#nav .brand img{height:30px}#wrap{flex-direction:column}#mn{order:-1;flex:none;height:46vh}#sb{width:100%;flex:1;border-right:0;border-top:1px solid var(--ln)}#ft{display:none}#nav .pb{width:70px}#nav .brand small{display:none}#sth .xy{display:none}}
@media(prefers-reduced-motion:reduce){#burst .cf,.rip{display:none}#burst .msg,.term.shake,.startb.nudge{animation:none}}
</style></head><body>
<header id="nav"><div class="brand"><img src="Images/logo.png" alt="Alrowad International Schools logo"style="height:18%;width:18%;"><span>AI LEARNING ACTIVITIES</span></div><div class="prog"><span id="pgt"></span><span class="pb"><i id="pgb"></i></span></div>
<div class="adm"><button id="admb" aria-haspopup="true" aria-expanded="false" aria-controls="admm">ADMIN ▾</button><div id="admm" role="menu" hidden><small>Administrator</small><b>Lone Firdous</b><a href="mailto:f.lone@ais.sch.sa">f.lone@ais.sch.sa</a></div></div></header>
<div id="wrap"><nav id="sb" aria-label="Tasks"></nav>
<main id="mn"><div id="sth"><span class="led"></span><span id="stt"></span><span class="xy" id="xy"></span></div>
<div id="sw"><div class="xl" id="xv"></div><div class="xl" id="xh"></div><div id="toast"></div><div id="hint"></div><div id="burst"></div><div id="lock"></div></div>
<div id="ro"></div></main></div>
<footer id="ft"><span><b>Program the AI:</b> each step lists up to 4 commands — type the ONE most related to the situation, then press Run.</span><span><b>Stuck?</b> Open the 🔑 Code key under the commands.</span></footer>
<script>
let cur=0,stopFns=[],sel=0,done=new Set();
try{JSON.parse(localStorage.getItem('aiw2')||'[]').forEach(x=>done.add(x))}catch(e){}
const raf=fn=>{const id=cur;(function f(){if(id!==cur)return;fn();requestAnimationFrame(f)})()};
const mk=()=>{const k=document.createElement('canvas');k.width=640;k.height=380;k.className='cv';return k};
const $=(b,s)=>b.querySelector(s);

/* ---------- 1. Obstacle avoidance (rule-trained) ---------- */
function T_avoid(b){
 const c=mk(),x=c.getContext('2d'),st=document.createElement('p');b.append(c,st);
 const R={x:60,y:190,a:0},O=[[300,120,32],[390,270,38],[520,150,30],[200,290,26]],K={front:null,side:null},E={hits:0,turns:0,crash:0,test:null};b.api={R,O,K,E};
 const hit=(X,Y)=>X<0||Y<0||X>640||Y>380||O.some(o=>Math.hypot(X-o[0],Y-o[1])<o[2]+10);
 const ray=a=>{for(let d=10;d<110;d+=5)if(hit(R.x+Math.cos(a)*d,R.y+Math.sin(a)*d))return d;return 110};
 let lastT=performance.now();
 raf(()=>{const now=performance.now(),ns=Math.max(1,Math.min(6,Math.round((now-lastT)/16.7)));lastT=now;let L,C,Q,s,v;
  for(let q=0;q<ns;q++){L=ray(R.a-.6);C=ray(R.a);Q=ray(R.a+.6);s='✅ Path clear → driving forward';v=2.2;
  if(K.front&&C<K.front){const t=L>Q?-1:1;R.a+=t*.09;v=C<=14?.2:.8;E.turns++;s='⚠️ Obstacle ahead → turning '+(t<0?'left':'right')+' to the open side'}
  else if(C<=14){v=0;s='💥 Collision! No avoidance rule trained yet';if(!E.crash){E.crash=1;E.hits++}}
  else if(K.side&&(L<K.side||Q<K.side)){v=1.1;s='🐢 Side obstacle close → slowing down'}
  if(C>14)E.crash=0;
  R.x=Math.max(8,Math.min(632,R.x+Math.cos(R.a)*v));R.y=Math.max(8,Math.min(372,R.y+Math.sin(R.a)*v));}
  x.clearRect(0,0,640,380);x.strokeStyle='rgba(148,163,184,.12)';x.lineWidth=1;
  for(let i=0;i<=640;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,380);x.stroke()}for(let j=0;j<=380;j+=40){x.beginPath();x.moveTo(0,j);x.lineTo(640,j);x.stroke()}
  x.fillStyle='#64748b';O.forEach(o=>{x.beginPath();x.arc(o[0],o[1],o[2],0,7);x.fill()});
  [[L,-.6],[C,0],[Q,.6]].forEach(([d,o],i)=>{const th=i==1?(K.front||75):(K.side||50);x.strokeStyle=d<th?'#ef4444':'#22c55e';x.lineWidth=2;x.beginPath();x.moveTo(R.x,R.y);x.lineTo(R.x+Math.cos(R.a+o)*d,R.y+Math.sin(R.a+o)*d);x.stroke()});
  x.lineWidth=1;x.fillStyle=E.crash?'#ef4444':'#6366f1';x.beginPath();x.arc(R.x,R.y,12,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(R.x+Math.cos(R.a)*7,R.y+Math.sin(R.a)*7,4,0,7);x.fill();
  G.t(x,'Rules trained: '+((K.front?1:0)+(K.side?1:0))+'/2'+(E.test?'   ·   Test drive '+Math.min(6,Math.floor((performance.now()-E.test.t0)/1000))+'/6 s · collisions '+(E.hits-E.test.h):''),14,24,14,'#cbd5e1');
  G.t(x,s,14,366,14,/💥/.test(s)?'#fca5a5':/⚠️|🐢/.test(s)?'#fcd34d':'#86efac');
  st.textContent=`Front ${C} · Left ${L} · Right ${Q} → ${s}`})}

/* ---------- 3. Line follower (rule-trained) ---------- */
function T_line(b){
